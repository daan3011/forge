  # quit: ["q"]
  # force_quit: ["ctrl+c"]     # also works while typing in a filter
  # help: ["?"]
  # next_tab: ["tab"]
  # prev_tab: ["shift+tab"]
  # goto_tab: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]  # nth key -> nth tab
  # refresh: ["r"]
  # refresh_all: ["R"]         # refresh every tab, visible or not
  # palette: ["ctrl+k"]        # command palette; also works while typing
  # projects: ["ctrl+p"]       # project switcher; also works while typing
  # goto_session: ["ctrl+g"]   # session picker: attach (resuming if needed)
  # Lists
  # up: ["k", "up"]
  # down: ["j", "down"]
  # top: ["g", "home"]
  # bottom: ["G", "end"]
  # page_down: ["ctrl+d"]
  # page_up: ["ctrl+u"]
  # filter: ["/"]
  # grow_pane: [">"]
  # shrink_pane: ["<"]
