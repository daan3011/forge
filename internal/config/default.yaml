# forge config
#
# Created by forge on first run. Every key is optional: anything you leave out
# (or comment out) falls back to the built-in default shown here.
# Strings in paths, plane.base_url and plane.api_key may use $VAR / ${VAR}
# environment variables, and paths may start with ~/.
#
# Run `forge config edit` to open this file, `forge config path` to print where it is.

# Projects are found automatically: every git checkout with a GitHub remote
# directly inside one of these folders, plus every repo you start forge or a
# session in. Without project_roots forge scans the parent of the repo you
# start it in and ~/Documents/Projects, ~/code, ~/src and ~/dev.
# project_roots:
#   - ~/code

# Optional overrides for detected projects, matched by repo. Only repo is
# required; set what you want to change. ctrl+p switches the active project.
# A repo's Plane project is matched by name or asked once on the Plane tab;
# set plane_project_id here only to pin it.
projects:
  # - repo: daan/forge                 # GitHub "owner/name"
  #   name: forge                      # name shown in the UI (default: repo name)
  #   path: ~/code/forge               # local checkout (default: the detected one)
  #   plane_project_id: ""             # Plane project UUID (default: matched or picked)
  #   docs_dir: .forge/docs            # relative to path (default .forge/docs)
  #   worktree_copy: [".env.local"]    # files copied into every agent worktree
  #   worktree_copy: [.env.local]      # globs copied from path into new agent worktrees

github:
  # How often PR and pipeline lists refresh in the background ("30s", "2m"; min 5s).
  refresh_interval: 60s
  # Sections on the PRs tab (h / l switch them). Each query uses GitHub
  # search syntax; is:pr is added when missing, repo:<owner/name> when a
  # project is active, and sort:updated-desc unless the query sorts itself.
  pr_sections:
    - title: My PRs
      query: "is:open author:@me"
    - title: Review requested
      query: "is:open review-requested:@me"
    - title: Involved
      query: "is:open involves:@me"
  # PRs not updated in this many days get a clock marker and an amber age;
  # twice as long turns it red. S shows stale PRs only. 0 turns it off.
  stale_after_days: 5

plane:
  # Plane API base URL; change it for self-hosted Plane (it must serve /api/v2).
  base_url: https://api.plane.so
  # Your workspace slug (the part after the host in Plane URLs).
  workspace_slug: ""
  # Prefer keeping the key in an environment variable. api_key, if set, wins.
  # api_key: ""
  api_key_env: PLANE_API_KEY
  # How often Plane lists refresh in the background (min 5s).
  refresh_interval: 2m
  # How many days back the board's Done / Cancelled columns reach (min 1).
  board_done_days: 14
  # The cycle summary counts open items as blocked when they carry one of
  # these labels or are in one of these states (names, case-insensitive).
  blocked_labels: [blocked]
  blocked_states: [Blocked]
  # When a PR's branch or title names a work item key (PROJ-123), forge links
  # them. Set this to also post a comment with the PR link on the item, once,
  # when an open PR is first linked.
  comment_on_pr_link: false

sessions:
  # Where agent worktrees are created
  # (default: $XDG_DATA_HOME/forge/worktrees or ~/.local/share/forge/worktrees).
  # worktree_root: ~/.local/share/forge/worktrees
  # Template used when starting a session without picking one.
  default_template: ""
  # Desktop notification when an agent waits for input this many minutes (0 = never).
  notify_after_minutes: 5
  # Desktop notification when an agent hits an error / finishes its turn,
  # while forge isn't focused (or isn't running).
  notify_on_error: true
  notify_on_finish: true
  # How often session status refreshes in the background (min 5s).
  refresh_interval: 10s
  # Sessions whose PRs are all merged or closed move to the archive with a
  # summary. Then remove their worktree and tmux window? ask | always | never
  archive_cleanup: ask

artifacts:
  # Globs of files to show in the Artifacts tab. Relative globs apply inside
  # every project checkout and session worktree; absolute ones (~ and $VAR
  # work) add folders of their own. ** matches any number of folders.
  # node_modules, .git, dist, build and other dot / build folders are
  # skipped. Leave empty for the defaults below; a list replaces them.
  watch:
    # - "**/*.html"
    # - "**/*.svg"
    # - "**/*.png"
    # - "design/**"
    # - ".forge/artifacts/**"
    # - ~/Desktop/mockups/**
  # How the detail pane previews images: auto | kitty | sixel | chafa | text | off.
  # auto uses kitty graphics (kitty, Ghostty), then sixel (WezTerm, foot,
  # iTerm2...), then chafa if installed, else just the file's details. SVGs
  # need rsvg-convert (librsvg). Inside tmux, graphics need
  # `set -g allow-passthrough on`.
  preview: auto

context:
  # Rough token budget (characters / 4) for the memory files Claude Code
  # loads at session start (CLAUDE.md, rules, imports, MEMORY.md). The
  # Context tab turns the total amber above it; 0 turns the warning off.
  token_budget: 8000

ui:
  # full | reduced | off
  animations: full
  # Override palette colours by name with #rgb or #rrggbb.
  theme:
    # ember: "#ff7a1a"
    # Names: charcoal surface steel ember molten coldblue smoke text onaccent error patina

# Override key bindings: action name -> list of keys. An override replaces
